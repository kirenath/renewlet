<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renewlet</title>
    <meta name="description" content="订阅管理助手（Go + Vite + PocketBase）" />
    <link id="renewlet-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("renewlet_theme_mode") || "dark";
          var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var shouldDark = mode === "dark" || (mode === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", shouldDark);

          var variant = localStorage.getItem("renewlet_theme_variant");
          if (!variant) return;
          if (["emerald", "ocean", "sunset", "lavender", "rose", "custom"].indexOf(variant) === -1) return;

          var root = document.documentElement;
          root.setAttribute("data-theme", variant);

          if (variant !== "custom") return;

          var raw = localStorage.getItem("renewlet_custom_theme_color");
          if (!raw) return;
          var color = JSON.parse(raw);
          if (!color || typeof color !== "object") return;

          var h = color.h, s = color.s, l = color.l;
          if (typeof h !== "number" || typeof s !== "number" || typeof l !== "number") return;
          if (h < 0 || h > 360 || s < 0 || s > 100 || l < 0 || l > 100) return;

          root.style.setProperty("--primary", h + " " + s + "% " + l + "%");
          root.style.setProperty("--primary-glow", h + " " + s + "% " + Math.min(l + 6, 100) + "%");
          root.style.setProperty("--ring", h + " " + s + "% " + l + "%");
          root.style.setProperty("--accent", h + " " + Math.max(s - 30, 20) + "% 20%");
          root.style.setProperty("--accent-foreground", h + " " + s + "% " + Math.min(l + 20, 100) + "%");
          root.style.setProperty("--success", h + " " + s + "% " + l + "%");
          root.style.setProperty("--sidebar-primary", h + " " + s + "% " + l + "%");
          root.style.setProperty("--sidebar-ring", h + " " + s + "% " + l + "%");
        } catch (_e) {
          /* ignore */
        }
      })();

      // 自定义 CSS 主题首屏注入（Requirements 7.8, 8.8, 8.11）
      // 同步阻塞执行，保证 React 挂载前 <head> 内已有 <style data-renewlet-custom-theme>。
      // 不读 React、不读 PocketBase、不发起任何 fetch。
      (function () {
        try {
          // (Req 7.8) URL 旁路 ?disableCustomCss=1：本会话强制不注入，且不修改持久化值
          var search = window.location.search || "";
          if (/(^|[?&])disableCustomCss=1(&|$)/.test(search)) return;

          // (Req 8.3) 总闸：只有严格等于 '0' 才视为禁用；其它（缺失 / 空 / '1' / 任何字符串）一律启用
          var enabledRaw = localStorage.getItem("renewlet_custom_themes_enabled");
          if (enabledRaw === "0") return;

          // (Req 8.2) 激活 CSS 文本：空串 / 缺失视为“无缓存 CSS”
          var css = localStorage.getItem("renewlet_active_custom_theme_css");
          if (!css) return;

          // (Req 8.11) 损坏检测：保守地用 string.length 近似 UTF-8 字节长度
          // CSS_Size_Limit = 102400 字节，2× 上限 = 204800；命中则同步清掉两个 key 后退出
          if (css.length > 204800) {
            try {
              localStorage.removeItem("renewlet_active_custom_theme_css");
            } catch (_e1) {
              /* ignore */
            }
            try {
              localStorage.removeItem("renewlet_active_custom_theme_id");
            } catch (_e2) {
              /* ignore */
            }
            return;
          }

          // (Req 6.2 / 8.8) 创建唯一 <style data-renewlet-custom-theme>，挂到 <head> 末尾
          // React 挂载后 CustomCssInjector 会按 [data-renewlet-custom-theme] 复用此节点
          var style = document.createElement("style");
          style.setAttribute("data-renewlet-custom-theme", "");
          style.textContent = css;
          document.head.appendChild(style);
        } catch (_e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
